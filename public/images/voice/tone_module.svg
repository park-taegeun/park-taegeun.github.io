<text x="325" y="162" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="400" fill="#586173" text-anchor="start">음 높이 · 음색 · 그 변화량</text>
<rect x="305" y="250" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#1A2B4A" stroke-width="2" opacity="1"/>
