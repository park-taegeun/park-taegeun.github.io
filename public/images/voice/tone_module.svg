<text x="325" y="322" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="400" fill="#586173" text-anchor="start">같은 사람 평소 목소리와의 차이</text>
<path d="M640,140 C680,140 680,215 715,215" fill="none" stroke="#586173" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M640,300 C680,300 680,215 715,215" fill="none" stroke="#586173" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="720" y="165" width="130" height="100" rx="12" fill="#EEF1F5" stroke="#DCE1E9" stroke-width="2" opacity="1"/>
<text x="785" y="210" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="21" font-weight="700" fill="#101A2C" text-anchor="middle">값 126개</text>
<text x="785" y="240" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="400" fill="#586173" text-anchor="middle">발화마다</text>
<line x1="855" y1="215" x2="885" y2="215" stroke="#586173" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="890" y="150" width="210" height="130" rx="12" fill="#E1F3F4" stroke="#0E7C86" stroke-width="3.5" opacity="1"/>
<text x="995" y="198" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="23" font-weight="700" fill="#0E7C86" text-anchor="middle">선형 변환층</text>
<text x="995" y="230" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="600" fill="#0E7C86" text-anchor="middle">약 129만 개</text>
<text x="995" y="258" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="400" fill="#586173" text-anchor="middle">학습한 부분</text>
<line x1="1105" y1="215" x2="1135" y2="215" stroke="#0E7C86" stroke-width="2.5" marker-end="url(#aht)"/>
<rect x="1140" y="130" width="225" height="170" rx="12" fill="#EEF1F5" stroke="#9AA6B4" stroke-width="2" stroke-dasharray="7 6" opacity="1"/>
<text x="1252" y="172" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="22" font-weight="700" fill="#586173" text-anchor="middle">LLM (Gemma 4)</text>
<rect x="1162" y="190" width="38" height="34" rx="5" fill="#0E7C86" stroke="#0E7C86" stroke-width="2" opacity="1"/>
<rect x="1210" y="190" width="38" height="34" rx="5" fill="#0E7C86" stroke="#0E7C86" stroke-width="2" opacity="1"/>
<rect x="1258" y="190" width="38" height="34" rx="5" fill="#0E7C86" stroke="#0E7C86" stroke-width="2" opacity="1"/>
<rect x="1306" y="190" width="38" height="34" rx="5" fill="#0E7C86" stroke="#0E7C86" stroke-width="2" opacity="1"/>
<text x="1252" y="250" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="400" fill="#586173" text-anchor="middle">토큰 4개 + 대사 텍스트</text>
<text x="1252" y="280" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="600" fill="#9AA6B4" text-anchor="middle">본체는 고정</text>
<text x="40" y="420" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="24" font-weight="700" fill="#101A2C" text-anchor="start">실시간 계산: 발화 1초당 57ms</text>
<text x="40" y="456" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="19" font-weight="400" fill="#586173" text-anchor="start">개인 PC CPU 기준, LLM 추론 제외. 특징 추출과 평소 대비 계산만 포함하며, 발화가 끝난 뒤 시작합니다.</text>
<rect x="40" y="514" width="22" height="18" rx="4" fill="#E1F3F4" stroke="#0E7C86" stroke-width="2" opacity="1"/>
<text x="72" y="528" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="400" fill="#586173" text-anchor="start">학습한 부분</text>
<rect x="204.6" y="514" width="22" height="18" rx="4" fill="#EEF1F5" stroke="#9AA6B4" stroke-width="2" stroke-dasharray="4 3" opacity="1"/>
<text x="236.6" y="528" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="400" fill="#586173" text-anchor="start">고정한 부분</text>
<line x1="369.2" y1="523" x2="395.2" y2="523" stroke="#586173" stroke-width="2.5" marker-end="url(#ah)"/>
<text x="401.2" y="528" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="400" fill="#586173" text-anchor="start">데이터 흐름</text>
