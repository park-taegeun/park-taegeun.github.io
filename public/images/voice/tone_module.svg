<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560" role="img" aria-label="어조 모듈 구조">
<title>어조 모듈 구조</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#586173"/></marker><marker id="aht" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0E7C86"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F1F3F6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#C3CAD6" stroke-width="3"/></pattern></defs>
<rect width="1400" height="560" fill="#FFFFFF"/>
<text x="40" y="54" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="30" font-weight="700" fill="#101A2C" text-anchor="start">어조 모듈: 텍스트에 없는 목소리 정보를 LLM 입력으로 변환</text>
<rect x="40" y="150" width="190" height="120" rx="12" fill="#EEF1F5" stroke="#DCE1E9" stroke-width="2" opacity="1"/>
<text x="135" y="203" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="24" font-weight="600" fill="#101A2C" text-anchor="middle">발화 음성</text>
<text x="135" y="236" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="18" font-weight="400" fill="#586173" text-anchor="middle">+ 화자 식별자</text>
<path d="M235,190 C270,190 270,140 300,140" fill="none" stroke="#586173" stroke-width="2.5" marker-end="url(#ah)"/>
<path d="M235,230 C270,230 270,300 300,300" fill="none" stroke="#586173" stroke-width="2.5" marker-end="url(#ah)"/>
<rect x="305" y="90" width="330" height="100" rx="12" fill="#FFFFFF" stroke="#1A2B4A" stroke-width="2" opacity="1"/>
