<text x="825" y="500" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', 'Noto Sans CJK KR', sans-serif" font-size="17" font-weight="400" fill="#586173" text-anchor="middle">p&lt;0.0001</text>
<line x1="725" y1="140" x2="725" y2="520" stroke="#DCE1E9" stroke-width="2" stroke-dasharray="5 5"/>
